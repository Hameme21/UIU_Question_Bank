    <path fill-rule="evenodd" d="M 256 90 C 172 90 108 154 108 238 C 108 322 172 386 256 386 C 288 386 317 376 342 359 L 372 389 C 378 395 387 398 396 398 C 414 398 428 384 428 366 C 428 357 425 348 419 342 L 388 311 C 398 289 404 264 404 238 C 404 154 340 90 256 90 Z M 256 162 C 298 162 332 196 332 238 C 332 280 298 314 256 314 C 214 314 180 280 180 238 C 180 196 214 162 256 162 Z"/>
    <!-- Angled Tail extension -->
    <path d="M 276 270 L 388 382 C 394 388 404 388 410 382 C 416 376 416 366 410 360 L 298 248 Z" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
